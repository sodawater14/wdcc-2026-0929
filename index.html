<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8e8e8">
  <meta name="description" content="Su Runxiang — WDCC 2026，同济大学 9.29 的十五场报告记录。">
  <title>WDCC 2026 / 9.29 TJU</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/gsap.min.js"></script>
  <script defer src="vendor/Flip.min.js"></script>
  <script type="module" src="app.js?v=range-3"></script>
</head>
<body>
  <main id="home">
    <header class="masthead">
      <div class="identity"><span>Su Runxiang</span><span class="identity-rule"></span><span>WDCC 2026<br>9.29 TJU</span></div>
      <span>Records of 15 Presentations</span>
    </header>
    <div id="grid" class="grid" aria-label="十五场报告"></div>
  </main>
  <article id="detail" class="detail" aria-label="报告详情" hidden>
    <div class="detail-top"><button id="back" class="text-button">Back</button></div>
    <section id="gallery" class="gallery" aria-label="报告图片，滚轮、拖动或左右方向键切换" tabindex="0">
      <div id="gallery-track" class="gallery-track"></div>
      <span id="gallery-status" class="sr-only" aria-live="polite"></span>
    </section>
    <div id="reader" class="reader collapsed">
      <nav id="tabs" class="tabs" aria-label="文案视图" role="tablist">
        <button id="tab-ai" class="text-button tab" role="tab" aria-selected="false" aria-controls="panel-ai" data-tab="ai">AI转录修复版 × 个人总结</button>
        <button id="tab-share" class="text-button tab" role="tab" aria-selected="false" aria-controls="panel-share" data-tab="share">分享你的看法吧</button>

      </nav>
      <div id="panel-ai" class="panel ai-panel" role="tabpanel" aria-labelledby="tab-ai" hidden>
        <div class="scroll-shell transcript-shell"><div class="audio-toolbar"><div id="audio-control" class="audio-control"><svg id="audio-seek" class="audio-ring" viewBox="0 0 48 48" role="slider" tabindex="0" aria-label="录音播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-disabled="true" aria-describedby="audio-time"><circle class="audio-ring-track" cx="24" cy="24" r="22"/><circle class="audio-progress" cx="24" cy="24" r="22" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/><circle class="audio-ring-hit" cx="24" cy="24" r="22"/><circle class="audio-progress-dot" cx="24" cy="2" r="2.5"/></svg><button id="audio-toggle" class="audio-toggle" aria-label="播放录音" aria-pressed="false"></button><span id="audio-time" class="audio-time">0:00 / --:--</span></div><span id="audio-status" class="audio-status" role="status"></span></div><div id="transcript" class="reading-scroll transcript" tabindex="0" aria-label="AI转录修复版"></div></div>
        <div class="scroll-shell summary-shell"><div id="personal-summary" class="reading-scroll personal-summary" tabindex="0" aria-label="个人总结"></div></div>
      </div>
      <div id="panel-share" class="panel share-panel" role="tabpanel" aria-labelledby="tab-share" hidden></div>
    </div>
  </article>
  <div id="transition-bg" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
  <div id="error" role="alert" hidden></div>
</body>
</html>
